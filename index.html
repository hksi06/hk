<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OHH → GTO Wizard 変換</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; margin: 0; }
    header { padding: 14px 16px; border-bottom: 1px solid rgba(127,127,127,.35); }
    h1 { font-size: 16px; margin: 0 0 6px 0; }
    .sub { font-size: 12px; opacity: .8; line-height: 1.4; }
    main { padding: 14px 16px; display: grid; gap: 10px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    button { padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(127,127,127,.45); font-size: 12px; cursor: pointer; }
    .status { font-size: 12px; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(127,127,127,.35); opacity: .9; }
    .ok { border-color: rgba(80,160,80,.45); }
    .err { border-color: rgba(200,80,80,.55); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
    textarea {
      width: 100%; min-height: 520px; resize: vertical; padding: 10px;
      border-radius: 10px; border: 1px solid rgba(127,127,127,.45);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px; line-height: 1.35;
    }
    .hint { font-size: 12px; opacity: .8; line-height: 1.4; }
    .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono"; border: 1px solid rgba(127,127,127,.45); border-bottom-width: 2px; padding: 1px 6px; border-radius: 7px; }
  </style>
</head>
<body>
<header>
  <h1>OHH(JSON) → GTO Wizardに貼れるテキストHH</h1>
  <div class="sub">
    左にOHH(JSON)を貼る → <span class="kbd">Convert</span> → 右の出力を <span class="kbd">Copy</span> → GTO Wizardへ貼り付け。<br>
    Heroが特定できないときだけ、最初に1回だけポップアップでHero名を聞きます（以後はこのブラウザ内に記憶）。
  </div>
</header>

<main>
  <div class="row">
    <button id="convertBtn">Convert</button>
    <button id="copyBtn">Copy</button>
    <button id="downloadBtn">Download .txt</button>
  </div>

  <div id="status" class="status">準備OK。左にJSONを貼って Convert。</div>

  <div class="grid">
    <div>
      <div class="hint">入力（OHH JSON）</div>
      <textarea id="input" spellcheck="false" placeholder="ここにOHH(JSON)を貼り付け"></textarea>
    </div>
    <div>
      <div class="hint">出力（GTO Wizard貼り付け用）</div>
      <textarea id="output" spellcheck="false" readonly></textarea>
      <div class="hint">※ 出力は「Heroのカードのみ表示」に固定（Wizardに通りやすい）。</div>
    </div>
  </div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const inputEl = $("input");
  const outputEl = $("output");
  const statusEl = $("status");

  // 固定：通貨記号（Wizardではほぼ飾り）
  const CUR = "$";

  function setStatus(msg, ok=true){
    statusEl.textContent = msg;
    statusEl.classList.remove("ok","err");
    statusEl.classList.add(ok ? "ok" : "err");
  }

  function fmt(n){
    const v = Math.round(Number(n || 0) * 100) / 100;
    const s = v.toFixed(2);
    return s.replace(/\.00$/, "").replace(/(\.\d)0$/, "$1");
  }

  function sanitizeName(name){
    const s = String(name ?? "").trim().replace(/\s+/g, "_");
    const cleaned = s.replace(/[^0-9A-Za-z_]/g, "");
    return cleaned || "Player";
  }

  function cardsBracket(cards){ return `[${(cards ?? []).join(" ")}]`; }

  function parseISOToUTC(iso){
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) {
      const now = new Date();
      return { handId: String(Date.now()), ts: "1970/01/01 00:00:00" };
    }
    const handId = String(d.getTime());
    const pad = (x) => String(x).padStart(2,"0");
    const ts = `${d.getUTCFullYear()}/${pad(d.getUTCMonth()+1)}/${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
    return { handId, ts };
  }

  function loadJsonObjects(text){
    const t = (text ?? "").trim();
    if (!t) return [];
    try {
      const obj = JSON.parse(t);
      if (Array.isArray(obj)) return obj;
      if (obj && typeof obj === "object") return [obj];
      throw new Error("JSONの形式が不正です。");
    } catch {
      // 複数JSONを空行で区切った形式
      const parts = t.split(/\n\s*\n/g).map(x => x.trim()).filter(Boolean);
      return parts.map(p => JSON.parse(p));
    }
  }

  function getOHHRoot(obj){
    if (obj && typeof obj === "object" && obj.ohh && typeof obj.ohh === "object") return obj.ohh;
    return obj;
  }

  function isPostAction(action){
    const a = String(action ?? "").toLowerCase();
    return a.includes("post sb") || a.includes("post bb") || a.includes("post ante") ||
           a.includes("post small blind") || a.includes("post big blind");
  }

  function buildPlayers(ohh){
    const playersRaw = Array.isArray(ohh.players) ? ohh.players : [];
    const seat2p = new Map();
    const id2p = new Map();
    const used = new Map();

    for (const p of playersRaw){
      const pid = Number(p.id);
      const seat = Number(p.seat);
      const rawName = String(p.name ?? `Player${pid}`);
      let name = sanitizeName(rawName);
      if (used.has(name)) name = `${name}_${seat}`;
      used.set(name, true);

      const stack = Number(p.starting_stack ?? 0);
      const cards = Array.isArray(p.cards) ? p.cards.slice() : [];
      const pl = { pid, seat, rawName, name, stack, cards };
      seat2p.set(seat, pl);
      id2p.set(pid, pl);
    }
    return { seat2p, id2p };
  }

  function pickHero(ohh, id2p){
    // 1) hero_player_id が有効ならそれ
    const hp = ohh.hero_player_id;
    if (typeof hp === "number" && id2p.has(hp)) return id2p.get(hp);

    // 2) cardsが入ってる人が1人だけならそれ
    const withCards = Array.from(id2p.values()).filter(p => Array.isArray(p.cards) && p.cards.length === 2);
    if (withCards.length === 1) return withCards[0];

    // 3) 前回使ったHero名（このブラウザ内）を試す
    const saved = localStorage.getItem("ohh2wizard_hero") || "";
    if (saved){
      for (const p of id2p.values()){
        if (p.name === saved) return p;
      }
    }

    // 4) それでも不明なら、ポップアップで1回だけ聞く
    const candidates = Array.from(id2p.values()).sort((a,b)=>a.seat-b.seat).map(p => p.name);
    const ans = window.prompt(
      "Hero名を入力してください（例: jGa）。候補:\n" + candidates.join(", "),
      saved || ""
    );
    if (!ans) throw new Error("Hero名が未入力です。");
    const heroName = sanitizeName(ans);
    for (const p of id2p.values()){
      if (p.name === heroName) {
        localStorage.setItem("ohh2wizard_hero", heroName);
        return p;
      }
    }
    throw new Error(`Hero名 '${heroName}' がplayersに見つかりません。`);
  }

  function processActions(actions, id2p, state){
    // state: { contrib: Map(pid->number), highest: number, inHand: Set(pid) }
    const lines = [];
    for (const a of actions){
      const pid = Number(a.player_id);
      if (!id2p.has(pid)) continue;
      const pl = id2p.get(pid);

      const act = String(a.action ?? "").trim();
      const actL = act.toLowerCase();
      const amt = Number(a.amount ?? 0);

      const getC = () => state.contrib.get(pid) ?? 0;
      const setC = (v) => state.contrib.set(pid, v);

      if (actL.includes("post sb") || actL.includes("post small blind")){
        const newC = getC() + amt; setC(newC); state.highest = Math.max(state.highest, newC);
        lines.push(`${pl.name}: posts small blind ${CUR}${fmt(amt)}`); continue;
      }
      if (actL.includes("post bb") || actL.includes("post big blind")){
        const newC = getC() + amt; setC(newC); state.highest = Math.max(state.highest, newC);
        lines.push(`${pl.name}: posts big blind ${CUR}${fmt(amt)}`); continue;
      }
      if (actL.includes("post ante")){
        const newC = getC() + amt; setC(newC); state.highest = Math.max(state.highest, newC);
        lines.push(`${pl.name}: posts ante ${CUR}${fmt(amt)}`); continue;
      }
      if (actL === "fold"){ state.inHand.delete(pid); lines.push(`${pl.name}: folds`); continue; }
      if (actL === "check"){ lines.push(`${pl.name}: checks`); continue; }

      if (actL === "bet"){
        const newTotal = amt;
        const put = Math.max(0, newTotal - getC());
        setC(newTotal); state.highest = Math.max(state.highest, newTotal);
        lines.push(`${pl.name}: bets ${CUR}${fmt(put)}`); continue;
      }

      if (actL === "call"){
        let newTotal = amt;
        let put = newTotal - getC();
        if (put < -1e-9){ put = amt; newTotal = getC() + put; }
        setC(newTotal); state.highest = Math.max(state.highest, newTotal);
        lines.push(`${pl.name}: calls ${CUR}${fmt(Math.max(0, put))}`); continue;
      }

      if (actL === "raise" || actL.includes("all")){
        const highestBefore = state.highest;
        let newTotal = amt;
        if (newTotal <= highestBefore + 1e-9) newTotal = highestBefore + amt; // increment形式対策
        const raiseInc = Math.max(0, newTotal - highestBefore);
        const put = Math.max(0, newTotal - getC());
        setC(newTotal); state.highest = Math.max(state.highest, newTotal);
        lines.push(`${pl.name}: raises ${CUR}${fmt(raiseInc)} to ${CUR}${fmt(newTotal)}`); continue;
      }

      // fallback
      lines.push(amt ? `${pl.name}: ${act} ${CUR}${fmt(amt)}` : `${pl.name}: ${act}`);
    }
    return lines;
  }

  function convertOne(obj){
    const ohh = getOHHRoot(obj);
    const { seat2p, id2p } = buildPlayers(ohh);
    const hero = pickHero(ohh, id2p);

    const sb = Number(ohh.small_blind_amount ?? 0);
    const bb = Number(ohh.big_blind_amount ?? 0);
    const table = String(ohh.table_name ?? "Table");
    const tableSize = Number(ohh.table_size ?? seat2p.size);
    const dealerSeat = Number(ohh.dealer_seat ?? 1);

    const startIso = String(ohh.start_date_utc ?? obj.createdAt ?? new Date().toISOString());
    const { handId, ts } = parseISOToUTC(startIso);

    const out = [];
    out.push(`PokerStars Hand #${handId}:  Hold'em No Limit (${CUR}${fmt(sb)}/${CUR}${fmt(bb)}) - ${ts} UTC`);
    out.push(`Table '${table}' ${tableSize}-max Seat #${dealerSeat} is the button`);

    const seats = Array.from(seat2p.keys()).sort((a,b)=>a-b);
    for (const s of seats){
      const p = seat2p.get(s);
      out.push(`Seat ${p.seat}: ${p.name} (${CUR}${fmt(p.stack)} in chips)`);
    }

    const rounds = new Map();
    for (const r of (ohh.rounds ?? [])) rounds.set(String(r.street), r);

    const pre = rounds.get("Preflop");
    if (!pre) throw new Error("Preflopが見つかりません。");

    const preActions = Array.isArray(pre.actions) ? pre.actions : [];
    let cut = 0;
    while (cut < preActions.length && isPostAction(preActions[cut].action)) cut++;

    const statePre = {
      contrib: new Map(Array.from(id2p.keys()).map(pid => [pid, 0])),
      highest: 0,
      inHand: new Set(Array.from(id2p.keys()))
    };

    out.push(...processActions(preActions.slice(0, cut), id2p, statePre));
    out.push("*** HOLE CARDS ***");
    if (hero.cards && hero.cards.length === 2) out.push(`Dealt to ${hero.name} ${cardsBracket(hero.cards)}`);
    else out.push(`Dealt to ${hero.name} [?? ??]`);
    out.push(...processActions(preActions.slice(cut), id2p, statePre));

    let board = [];

    function streetBlock(street){
      const r = rounds.get(street);
      if (!r) return;
      const cards = Array.isArray(r.cards) ? r.cards : [];
      const acts = Array.isArray(r.actions) ? r.actions : [];

      const state = {
        contrib: new Map(Array.from(id2p.keys()).map(pid => [pid, 0])),
        highest: 0,
        inHand: statePre.inHand
      };

      if (street === "Flop"){
        board = cards.slice();
        out.push(`*** FLOP *** ${cardsBracket(board)}`);
      } else if (street === "Turn"){
        board = board.concat(cards);
        out.push(`*** TURN *** ${cardsBracket(board.slice(0,3))} ${cardsBracket([board[3]])}`);
      } else if (street === "River"){
        board = board.concat(cards);
        out.push(`*** RIVER *** ${cardsBracket(board.slice(0,4))} ${cardsBracket([board[4]])}`);
      }
      out.push(...processActions(acts, id2p, state));
    }

    streetBlock("Flop");
    streetBlock("Turn");
    streetBlock("River");

    out.push("*** SHOW DOWN ***");
    // Wizardに通しやすい：Heroのみshow、他は見せない
    out.push((hero.cards && hero.cards.length === 2)
      ? `${hero.name}: shows ${cardsBracket(hero.cards)}`
      : `${hero.name}: doesn't show hand`
    );
    for (const pid of statePre.inHand){
      if (pid === hero.pid) continue;
      out.push(`${id2p.get(pid).name}: doesn't show hand`);
    }

    const pots = Array.isArray(ohh.pots) ? ohh.pots : [];
    if (pots.length){
      for (const p of pots){
        for (const w of (p.player_wins ?? [])){
          const wp = id2p.get(Number(w.player_id));
          if (wp) out.push(`${wp.name} collected ${CUR}${fmt(w.win_amount ?? 0)} from pot`);
        }
      }
    }

    out.push("*** SUMMARY ***");
    if (pots.length){
      out.push(`Total pot ${CUR}${fmt(pots[0].amount ?? 0)} | Rake ${CUR}${fmt(pots[0].rake ?? 0)}`);
    }
    if (board.length) out.push(`Board ${cardsBracket(board)}`);

    return out.join("\n");
  }

  function convertAll(){
    try{
      const objs = loadJsonObjects(inputEl.value);
      if (!objs.length) throw new Error("JSONが空です。");
      const outs = objs.map(convertOne);
      outputEl.value = outs.join("\n\n");
      setStatus(`変換OK: ${outs.length}ハンド`, true);
    } catch (e) {
      outputEl.value = "";
      setStatus(`エラー: ${e.message ?? e}`, false);
    }
  }

  $("convertBtn").addEventListener("click", convertAll);

  $("copyBtn").addEventListener("click", async () => {
    try{
      await navigator.clipboard.writeText(outputEl.value || "");
      setStatus("コピーしました。GTO Wizardへ貼り付けOK。", true);
    } catch {
      setStatus("コピーに失敗しました。右の出力欄を手動で全選択→コピーしてください。", false);
    }
  });

  $("downloadBtn").addEventListener("click", () => {
    const txt = outputEl.value || "";
    const blob = new Blob([txt], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "wizard_handhistory.txt";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setStatus("TXTをダウンロードしました。", true);
  });
})();
</script>
</body>
</html>
