<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OHH → GTO Wizard 変換</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; margin: 0; }
    header { padding: 14px 16px; border-bottom: 1px solid rgba(127,127,127,.35); }
    h1 { font-size: 16px; margin: 0 0 6px 0; }
    .sub { font-size: 12px; opacity: .8; line-height: 1.4; }
    main { padding: 14px 16px; display: grid; gap: 10px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button, select {
      padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(127,127,127,.45);
      font-size: 12px;
    }
    button { cursor: pointer; }
    .status { font-size: 12px; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(127,127,127,.35); opacity: .95; }
    .ok { border-color: rgba(80,160,80,.45); }
    .err { border-color: rgba(200,80,80,.55); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
    textarea {
      width: 100%; min-height: 520px; resize: vertical; padding: 10px;
      border-radius: 10px; border: 1px solid rgba(127,127,127,.45);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px; line-height: 1.35;
    }
    .hint { font-size: 12px; opacity: .8; line-height: 1.4; }
    .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono"; border: 1px solid rgba(127,127,127,.45); border-bottom-width: 2px; padding: 1px 6px; border-radius: 7px; }
    .spacer { flex: 1; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono"; }
  </style>
</head>
<body>
<header>
  <h1>OHH(JSON) → GTO Wizardに貼れるテキストHH</h1>
  <div class="sub">
    左にOHH(JSON)を貼る → <span class="kbd">Convert</span> → <span class="kbd">Copy</span> → GTO Wizardへ。<br>
    修正点: <b>フォールド勝ちのときは SHOW DOWN を出しません</b>（本家PokerStars形式に寄せて判定ズレを防止）。
    SUMMARYに <code>(button)</code>/<code>(small blind)</code>/<code>(big blind)</code> も出します。
  </div>
</header>

<main>
  <div class="row">
    <button id="convertBtn">Convert</button>
    <button id="copyBtn">Copy</button>
    <button id="downloadBtn">Download .txt</button>

    <div class="spacer"></div>

    <label class="hint" for="heroSelect">Hero:</label>
    <select id="heroSelect" title="Heroを選択（Autoはカードあり最小Seat）">
      <option value="auto" selected>Auto (lowest seat with hole cards)</option>
    </select>

    <div id="status" class="status">準備OK。左にJSONを貼って Convert。</div>
  </div>

  <div class="grid">
    <div>
      <div class="hint">入力（OHH JSON）</div>
      <textarea id="input" spellcheck="false" placeholder="ここにOHH(JSON)を貼り付け"></textarea>
    </div>
    <div>
      <div class="hint">出力（GTO Wizard貼り付け用）</div>
      <textarea id="output" spellcheck="false" readonly></textarea>
      <div class="hint">※ 他プレイヤーのホールカードは出しません（Dealt to Hero のみ）。</div>
    </div>
  </div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const inputEl = $("input");
  const outputEl = $("output");
  const statusEl = $("status");
  const heroSelect = $("heroSelect");

  const CUR = "$";

  function setStatus(msg, ok=true){
    statusEl.textContent = msg;
    statusEl.classList.remove("ok","err");
    statusEl.classList.add(ok ? "ok" : "err");
  }

  function fmt(n){
    const v = Math.round(Number(n || 0) * 100) / 100;
    const s = v.toFixed(2);
    return s.replace(/\.00$/, "").replace(/(\.\d)0$/, "$1");
  }

  function sanitizeName(name){
    const s = String(name ?? "").trim().replace(/\s+/g, "_");
    const cleaned = s.replace(/[^0-9A-Za-z_]/g, "");
    return cleaned || "Player";
  }

  function cardsBracket(cards){ return `[${(cards ?? []).join(" ")}]`; }

  function parseISOToUTC(iso){
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return { handId: String(Date.now()), ts: "1970/01/01 00:00:00" };
    const handId = String(d.getTime());
    const pad = (x) => String(x).padStart(2,"0");
    const ts = `${d.getUTCFullYear()}/${pad(d.getUTCMonth()+1)}/${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
    return { handId, ts };
  }

  function loadJsonObjects(text){
    const t = (text ?? "").trim();
    if (!t) return [];
    try {
      const obj = JSON.parse(t);
      if (Array.isArray(obj)) return obj;
      if (obj && typeof obj === "object") return [obj];
      throw new Error("JSONの形式が不正です。");
    } catch {
      const parts = t.split(/\n\s*\n/g).map(x => x.trim()).filter(Boolean);
      return parts.map(p => JSON.parse(p));
    }
  }

  function getOHHRoot(obj){
    if (obj && typeof obj === "object" && obj.ohh && typeof obj.ohh === "object") return obj.ohh;
    return obj;
  }

  function buildPlayers(ohh){
    const playersRaw = Array.isArray(ohh.players) ? ohh.players : [];
    const seat2p = new Map();
    const id2p = new Map();
    const used = new Map();

    for (const p of playersRaw){
      const pid = Number(p.id);
      const seat = Number(p.seat);
      const rawName = String(p.name ?? `Player${pid}`);
      let name = sanitizeName(rawName);
      if (used.has(name)) name = `${name}_${seat}`;
      used.set(name, true);

      const stack = Number(p.starting_stack ?? 0);
      const cards = Array.isArray(p.cards) ? p.cards.slice() : [];
      const pl = { pid, seat, rawName, name, stack, cards };
      seat2p.set(seat, pl);
      id2p.set(pid, pl);
    }
    return { seat2p, id2p };
  }

  function normalizeAction(action){
    const a = String(action ?? "").trim().toLowerCase();
    if (a === "post sb" || a === "post small blind") return "post_sb";
    if (a === "post bb" || a === "post big blind") return "post_bb";
    if (a === "post ante") return "post_ante";
    if (a === "fold") return "fold";
    if (a === "check") return "check";
    if (a === "call") return "call";
    if (a === "bet") return "bet";
    if (a === "raise") return "raise";
    if (a.includes("all")) return "allin";
    return a;
  }

  function streetLabel(street){
    if (street === "Preflop") return "Preflop";
    if (street === "Flop") return "Flop";
    if (street === "Turn") return "Turn";
    if (street === "River") return "River";
    return street || "";
  }

  function updateHeroMenuFromFirstHand(objs){
    const prev = heroSelect.value;

    heroSelect.innerHTML = "";
    const optAuto = document.createElement("option");
    optAuto.value = "auto";
    optAuto.textContent = "Auto (lowest seat with hole cards)";
    heroSelect.appendChild(optAuto);

    if (!objs.length) return;

    const ohh = getOHHRoot(objs[0]);
    const { seat2p } = buildPlayers(ohh);
    const seats = Array.from(seat2p.keys()).sort((a,b)=>a-b);

    for (const s of seats){
      const p = seat2p.get(s);
      const hasCards = Array.isArray(p.cards) && p.cards.length === 2;
      const opt = document.createElement("option");
      opt.value = String(p.pid); // pidで選ぶ（名前変更に強い）
      opt.textContent = hasCards ? `Seat ${p.seat}: ${p.name}` : `Seat ${p.seat}: ${p.name} (no cards)`;
      if (!hasCards) opt.disabled = true; // カード無しは選ばせない（Wizardエラー回避）
      heroSelect.appendChild(opt);
    }

    const exists = Array.from(heroSelect.options).some(o => o.value === prev && !o.disabled);
    heroSelect.value = exists ? prev : "auto";
  }

  function pickHero(id2p){
    const selected = heroSelect.value;
    if (selected !== "auto"){
      const pid = Number(selected);
      if (id2p.has(pid) && id2p.get(pid).cards?.length === 2) return { heroPid: pid, note: `Hero=Seat ${id2p.get(pid).seat}` };
    }
    const withCards = Array.from(id2p.values()).filter(p => (p.cards?.length === 2)).sort((a,b)=>a.seat-b.seat);
    if (withCards.length) return { heroPid: withCards[0].pid, note: `Hero=Seat ${withCards[0].seat} (Auto)` };
    // ここは基本来ない想定（カード無しだとWizardが厳しい）
    const seats = Array.from(id2p.values()).sort((a,b)=>a.seat-b.seat);
    return { heroPid: seats[0]?.pid ?? -1, note: "警告: ホールカード情報なし" };
  }

  function getRound(ohh, street){
    const rounds = Array.isArray(ohh.rounds) ? ohh.rounds : [];
    return rounds.find(r => String(r.street) === street) || null;
  }

  function convertOne(obj){
    const ohh = getOHHRoot(obj);
    const { seat2p, id2p } = buildPlayers(ohh);

    const { heroPid, note } = pickHero(id2p);
    const hero = id2p.get(heroPid);
    if (!hero) throw new Error("Heroが見つかりません。");

    const nameOf = (pid) => (pid === heroPid ? "Hero" : (id2p.get(pid)?.name ?? "Player"));

    const sbAmt = Number(ohh.small_blind_amount ?? 0);
    const bbAmt = Number(ohh.big_blind_amount ?? 0);
    const table = String(ohh.table_name ?? "Table");
    const tableSize = Number(ohh.table_size ?? seat2p.size);
    const dealerSeat = Number(ohh.dealer_seat ?? hero.seat);

    const startIso = String(ohh.start_date_utc ?? obj.createdAt ?? new Date().toISOString());
    const { handId, ts } = parseISOToUTC(startIso);

    // SB/BB pid を action から拾う
    let sbPid = null, bbPid = null;
    const pre = getRound(ohh, "Preflop");
    const preActions = Array.isArray(pre?.actions) ? pre.actions : [];
    for (const a of preActions){
      const act = normalizeAction(a.action);
      if (act === "post_sb") sbPid = Number(a.player_id);
      if (act === "post_bb") bbPid = Number(a.player_id);
    }

    // Button pid（dealerSeatに座ってる人）
    let btnPid = null;
    if (seat2p.has(dealerSeat)) btnPid = seat2p.get(dealerSeat).pid;

    // winner map
    const winMap = new Map(); // pid -> amount
    const pots = Array.isArray(ohh.pots) ? ohh.pots : [];
    for (const p of pots){
      const wins = Array.isArray(p.player_wins) ? p.player_wins : [];
      for (const w of wins){
        const pid = Number(w.player_id);
        winMap.set(pid, (winMap.get(pid) || 0) + Number(w.win_amount ?? 0));
      }
    }

    // Fold street record
    const foldAt = new Map(); // pid -> "Preflop"/"Flop"/"Turn"/"River"
    const invested = new Map(); // pid -> did put money voluntarily or forced (for "(didn't bet)" 判定の補助)
    for (const pid of id2p.keys()) invested.set(pid, 0);

    // Output build
    const out = [];
    out.push(`PokerStars Hand #${handId}:  Hold'em No Limit (${CUR}${fmt(sbAmt)}/${CUR}${fmt(bbAmt)}) - ${ts} UTC`);
    out.push("");
    out.push(`Table '${table}' ${tableSize}-max Seat #${dealerSeat} is the button`);
    out.push("");

    const seats = Array.from(seat2p.keys()).sort((a,b)=>a-b);
    for (const s of seats){
      const p = seat2p.get(s);
      out.push(`Seat ${p.seat}: ${nameOf(p.pid)} (${CUR}${fmt(p.stack)} in chips)`);
    }
    out.push("");

    // Active players
    const active = new Set(Array.from(id2p.keys()));
    let endedByFold = false;
    let endStreet = null;
    let lastAggressor = { street: null, pid: null, put: 0 }; // for uncalled bet line (postflop only)

    function streetState(){
      return {
        contrib: new Map(Array.from(id2p.keys()).map(pid => [pid, 0])),
        highest: 0
      };
    }

    function applyActionLine(a, st, street){
      const pid = Number(a.player_id);
      if (!id2p.has(pid)) return null;
      const who = nameOf(pid);
      const act = normalizeAction(a.action);
      const amt = Number(a.amount ?? 0);

      const getC = () => st.contrib.get(pid) ?? 0;
      const setC = (v) => st.contrib.set(pid, v);

      if (act === "post_sb"){
        invested.set(pid, (invested.get(pid) || 0) + amt);
        const newC = getC() + amt; setC(newC); st.highest = Math.max(st.highest, newC);
        return `${who}: posts small blind ${CUR}${fmt(amt)}`;
      }
      if (act === "post_bb"){
        invested.set(pid, (invested.get(pid) || 0) + amt);
        const newC = getC() + amt; setC(newC); st.highest = Math.max(st.highest, newC);
        return `${who}: posts big blind ${CUR}${fmt(amt)}`;
      }
      if (act === "post_ante"){
        invested.set(pid, (invested.get(pid) || 0) + amt);
        const newC = getC() + amt; setC(newC); st.highest = Math.max(st.highest, newC);
        return `${who}: posts the ante ${CUR}${fmt(amt)}`;
      }

      if (act === "fold"){
        if (!foldAt.has(pid)) foldAt.set(pid, street);
        active.delete(pid);
        return `${who}: folds`;
      }
      if (act === "check"){
        return `${who}: checks`;
      }

      if (act === "bet"){
        const newTotal = amt;
        const put = Math.max(0, newTotal - getC());
        invested.set(pid, (invested.get(pid) || 0) + put);
        setC(newTotal); st.highest = Math.max(st.highest, newTotal);

        lastAggressor = { street, pid, put };
        return `${who}: bets ${CUR}${fmt(put)}`;
      }

      if (act === "call"){
        let newTotal = amt;
        let put = newTotal - getC();
        if (put < -1e-9){
          put = amt;
          newTotal = getC() + put;
        }
        invested.set(pid, (invested.get(pid) || 0) + Math.max(0, put));
        setC(newTotal); st.highest = Math.max(st.highest, newTotal);
        return `${who}: calls ${CUR}${fmt(Math.max(0, put))}`;
      }

      if (act === "raise" || act === "allin"){
        const highestBefore = st.highest;
        let newTotal = amt;
        if (newTotal <= highestBefore + 1e-9) newTotal = highestBefore + amt;

        const raiseInc = Math.max(0, newTotal - highestBefore);
        const put = Math.max(0, newTotal - getC());

        invested.set(pid, (invested.get(pid) || 0) + put);
        setC(newTotal); st.highest = Math.max(st.highest, newTotal);

        lastAggressor = { street, pid, put };
        return `${who}: raises ${CUR}${fmt(raiseInc)} to ${CUR}${fmt(newTotal)}`;
      }

      // fallback
      return amt ? `${who}: ${a.action} ${CUR}${fmt(amt)}` : `${who}: ${a.action}`;
    }

    // ---- Preflop: posts -> HOLE CARDS -> rest ----
    const preSt = streetState();
    let lastPostIdx = -1;
    for (let i = 0; i < preActions.length; i++){
      const act = normalizeAction(preActions[i].action);
      if (act === "post_sb" || act === "post_bb" || act === "post_ante") lastPostIdx = i;
    }

    // posts
    for (let i = 0; i <= lastPostIdx; i++){
      if (i < 0) break;
      const line = applyActionLine(preActions[i], preSt, "Preflop");
      if (line) out.push(line);
    }

    out.push("*** HOLE CARDS ***");
    out.push(`Dealt to Hero ${cardsBracket(hero.cards || ["??","??"])}`);

    // rest actions
    for (let i = lastPostIdx + 1; i < preActions.length; i++){
      const line = applyActionLine(preActions[i], preSt, "Preflop");
      if (line) out.push(line);

      // end by fold?
      if (!endedByFold && active.size === 1){
        endedByFold = true;
        endStreet = "Preflop";
        break;
      }
    }

    // helper to process later streets
    const board = [];
    function doStreet(streetName, headerFn){
      if (endedByFold) return;
      const r = getRound(ohh, streetName);
      if (!r) return;
      const cards = Array.isArray(r.cards) ? r.cards : [];
      const acts  = Array.isArray(r.actions) ? r.actions : [];

      // board update + header
      for (const c of cards) board.push(c);
      out.push(headerFn());

      const st = streetState();
      lastAggressor = { street: streetName, pid: null, put: 0 };

      for (const a of acts){
        const line = applyActionLine(a, st, streetName);
        if (line) out.push(line);

        if (active.size === 1){
          endedByFold = true;
          endStreet = streetName;
          // postflopのフォールド勝ちなら uncalled bet を返す行を入れる（PokerStarsっぽく）
          if (streetName !== "Preflop" && lastAggressor.pid !== null && lastAggressor.put > 0){
            out.push(`Uncalled bet (${CUR}${fmt(lastAggressor.put)}) returned to ${nameOf(lastAggressor.pid)}`);
          }
          return;
        }
      }
    }

    const flop = getRound(ohh, "Flop");
    if (flop){
      doStreet("Flop", () => `*** FLOP *** ${cardsBracket(board.length ? board : flop.cards)}`);
    }
    const turn = getRound(ohh, "Turn");
    if (turn){
      doStreet("Turn", () => `*** TURN *** ${cardsBracket(board.slice(0,3))} ${cardsBracket([board[3]])}`);
    }
    const river = getRound(ohh, "River");
    if (river){
      doStreet("River", () => `*** RIVER *** ${cardsBracket(board.slice(0,4))} ${cardsBracket([board[4]])}`);
    }

    // ---- Collection / Showdown ----
    // winner pid
    let winnerPid = null;
    if (active.size === 1){
      winnerPid = Array.from(active)[0];
    } else if (winMap.size){
      // 最大勝ちをwinnerとして扱う（分割はありうるが簡易）
      winnerPid = Array.from(winMap.entries()).sort((a,b)=>b[1]-a[1])[0][0];
    }

    // collected line
    if (winnerPid !== null && winMap.has(winnerPid)){
      out.push(`${nameOf(winnerPid)} collected ${CUR}${fmt(winMap.get(winnerPid))} from pot`);
    }

    // ★フォールド勝ちはSHOW DOWNを出さない（今回の修正ポイント）
    const hasShowdown = (!endedByFold && river); // ざっくり: リバーまでいってフォールド終了してなければ
    if (hasShowdown){
      out.push("*** SHOW DOWN ***");
      out.push(`Hero: shows ${cardsBracket(hero.cards || ["??","??"])}`);
      for (const pid of id2p.keys()){
        if (pid === heroPid) continue;
        out.push(`${nameOf(pid)}: doesn't show hand`);
      }
    }

    // ---- SUMMARY（Seatごとの button/sb/bb を明示）----
    out.push("*** SUMMARY ***");
    const totalPot = pots.length ? Number(pots[0].amount ?? 0) : 0;
    const rake = pots.length ? Number(pots[0].rake ?? 0) : 0;
    out.push(`Total pot ${CUR}${fmt(totalPot)} | Rake ${CUR}${fmt(rake)}`);
    if (board.length) out.push(`Board ${cardsBracket(board)}`);
    out.push("");

    function rolesOf(pid){
      const roles = [];
      if (btnPid !== null && pid === btnPid) roles.push("button");
      if (sbPid !== null && pid === sbPid) roles.push("small blind");
      if (bbPid !== null && pid === bbPid) roles.push("big blind");
      return roles;
    }

    function foldText(st){
      if (st === "Preflop") return "folded before Flop";
      if (st === "Flop") return "folded on the Flop";
      if (st === "Turn") return "folded on the Turn";
      if (st === "River") return "folded on the River";
      return "folded";
    }

    for (const s of seats){
      const p = seat2p.get(s);
      const pid = p.pid;
      const who = nameOf(pid);
      const roles = rolesOf(pid).map(r => `(${r})`).join(" ");
      const prefix = `Seat ${p.seat}: ${who}${roles ? " " + roles : ""} `;

      if (winMap.has(pid)){
        // フォールド勝ちは collected、ショウダウン勝ちは showed/collected どちらでもOKだが、ここはシンプルに collected で統一
        out.push(`${prefix}collected (${CUR}${fmt(winMap.get(pid))})`);
        continue;
      }

      if (foldAt.has(pid)){
        const st = foldAt.get(pid);
        // "(didn't bet)" は blinds/ante等を払ってない人にだけ付ける（PokerStarsっぽい）
        const didBet = (invested.get(pid) || 0) > 0;
        const didntBet = (!didBet) ? " (didn't bet)" : "";
        out.push(`${prefix}${foldText(st)}${didntBet}`);
        continue;
      }

      // 参加してショウダウン負け等（簡易）
      out.push(`${prefix}finished hand`);
    }

    return { text: out.join("\n"), note };
  }

  function convertAll(){
    const objs = loadJsonObjects(inputEl.value);
    if (!objs.length) throw new Error("JSONが空です。");

    updateHeroMenuFromFirstHand(objs);

    const outs = [];
    let note = "";
    for (let i = 0; i < objs.length; i++){
      const res = convertOne(objs[i]);
      outs.push(res.text);
      if (i === 0) note = res.note || "";
    }
    outputEl.value = outs.join("\n\n");
    setStatus(`変換OK: ${outs.length}ハンド。${note}`, true);
  }

  // 入力が固まったらHeroメニュー更新
  let debounceTimer = null;
  inputEl.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      try{
        const objs = loadJsonObjects(inputEl.value);
        if (!objs.length) return;
        updateHeroMenuFromFirstHand(objs);
      } catch {}
    }, 250);
  });

  $("convertBtn").addEventListener("click", () => {
    try { convertAll(); }
    catch(e){ outputEl.value=""; setStatus(`エラー: ${e.message ?? e}`, false); }
  });

  heroSelect.addEventListener("change", () => {
    if ((inputEl.value || "").trim()){
      try { convertAll(); }
      catch(e){ outputEl.value=""; setStatus(`エラー: ${e.message ?? e}`, false); }
    }
  });

  $("copyBtn").addEventListener("click", async () => {
    try{
      await navigator.clipboard.writeText(outputEl.value || "");
      setStatus("コピーしました。GTO Wizardへ貼り付けOK。", true);
    } catch {
      setStatus("コピー失敗。右の出力欄を手動で全選択→コピーしてください。", false);
    }
  });

  $("downloadBtn").addEventListener("click", () => {
    const txt = outputEl.value || "";
    const blob = new Blob([txt], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "wizard_handhistory.txt";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setStatus("TXTをダウンロードしました。", true);
  });
})();
</script>
