<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OHH → GTO Wizard 変換</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; margin: 0; }
    header { padding: 14px 16px; border-bottom: 1px solid rgba(127,127,127,.35); }
    h1 { font-size: 16px; margin: 0 0 6px 0; }
    .sub { font-size: 12px; opacity: .8; line-height: 1.4; }
    main { padding: 14px 16px; display: grid; gap: 10px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button, select {
      padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(127,127,127,.45);
      font-size: 12px;
    }
    button { cursor: pointer; }
    .status { font-size: 12px; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(127,127,127,.35); opacity: .95; }
    .ok { border-color: rgba(80,160,80,.45); }
    .err { border-color: rgba(200,80,80,.55); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
    textarea {
      width: 100%; min-height: 520px; resize: vertical; padding: 10px;
      border-radius: 10px; border: 1px solid rgba(127,127,127,.45);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px; line-height: 1.35;
    }
    .hint { font-size: 12px; opacity: .8; line-height: 1.4; }
    .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New"; border: 1px solid rgba(127,127,127,.45); border-bottom-width: 2px; padding: 1px 6px; border-radius: 7px; }
    .spacer { flex: 1; }
  </style>
</head>
<body>
<header>
  <h1>OHH(JSON) → GTO Wizardに貼れるテキストHH</h1>
  <div class="sub">
    左にOHH(JSON)を貼る → <span class="kbd">Convert</span> → <span class="kbd">Copy</span> → GTO Wizardへ。<br>
    出力はPokerStars風に寄せます（USD表記・2桁小数・フォールド勝ちはSHOW DOWN無し・SUMMARYのSeat行あり）。
  </div>
</header>

<main>
  <div class="row">
    <button id="convertBtn">Convert</button>
    <button id="copyBtn">Copy</button>
    <button id="downloadBtn">Download .txt</button>

    <div class="spacer"></div>

    <label class="hint" for="heroSelect">Hero:</label>
    <select id="heroSelect" title="Heroを選択（Auto=カードあり最小Seat）">
      <option value="auto" selected>Auto (lowest seat with hole cards)</option>
    </select>

    <div id="status" class="status">準備OK。左にJSONを貼って Convert。</div>
  </div>

  <div class="grid">
    <div>
      <div class="hint">入力（OHH JSON）</div>
      <textarea id="input" spellcheck="false" placeholder="ここにOHH(JSON)を貼り付け"></textarea>
    </div>
    <div>
      <div class="hint">出力（GTO Wizard貼り付け用）</div>
      <textarea id="output" spellcheck="false" readonly></textarea>
      <div class="hint">※ 他プレイヤーのホールカードは出しません（Heroのみ）。</div>
    </div>
  </div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const inputEl = $("input");
  const outputEl = $("output");
  const statusEl = $("status");
  const heroSelect = $("heroSelect");

  const CUR = "$";
  const CURCODE = "USD";

  function setStatus(msg, ok=true){
    statusEl.textContent = msg;
    statusEl.classList.remove("ok","err");
    statusEl.classList.add(ok ? "ok" : "err");
  }

  function money(n){
    const v = Math.round(Number(n || 0) * 100) / 100;
    return v.toFixed(2);
  }

  function sanitizeName(name){
    const s = String(name ?? "").trim().replace(/\s+/g, "_");
    const cleaned = s.replace(/[^0-9A-Za-z_]/g, "");
    return cleaned || "Player";
  }

  function cardsBracket(cards){ return `[${(cards ?? []).join(" ")}]`; }

  function parseISOToUTC(iso){
    const d = new Date(iso);
    const pad = (x) => String(x).padStart(2,"0");
    if (Number.isNaN(d.getTime())){
      return { handId: String(Date.now()), ts: "1970/01/01 00:00:00" };
    }
    const handId = String(d.getTime());
    const ts = `${d.getUTCFullYear()}/${pad(d.getUTCMonth()+1)}/${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
    return { handId, ts };
  }

  function loadJsonObjects(text){
    const t = (text ?? "").trim();
    if (!t) return [];
    try{
      const obj = JSON.parse(t);
      if (Array.isArray(obj)) return obj;
      if (obj && typeof obj === "object") return [obj];
      throw new Error("JSONの形式が不正です。");
    }catch{
      const parts = t.split(/\n\s*\n/g).map(x => x.trim()).filter(Boolean);
      return parts.map(p => JSON.parse(p));
    }
  }

  function getOHHRoot(obj){
    if (obj && typeof obj === "object" && obj.ohh && typeof obj.ohh === "object") return obj.ohh;
    return obj;
  }

  function normalizeAct(s){
    const a = String(s ?? "").trim().toLowerCase();
    if (a === "post sb" || a === "post small blind") return "post_sb";
    if (a === "post bb" || a === "post big blind") return "post_bb";
    if (a === "post ante") return "post_ante";
    if (a === "fold") return "fold";
    if (a === "check") return "check";
    if (a === "call") return "call";
    if (a === "bet") return "bet";
    if (a === "raise") return "raise";
    if (a.includes("all")) return "allin";
    return a;
  }

  function buildPlayers(ohh){
    const playersRaw = Array.isArray(ohh.players) ? ohh.players : [];
    const seat2p = new Map();
    const id2p = new Map();
    const used = new Map();

    for (const p of playersRaw){
      const pid = Number(p.id);
      const seat = Number(p.seat);
      const rawName = String(p.name ?? `Player${pid}`);
      let name = sanitizeName(rawName);
      if (used.has(name)) name = `${name}_${seat}`;
      used.set(name, true);

      const stack = Number(p.starting_stack ?? 0);
      const cards = Array.isArray(p.cards) ? p.cards.slice() : [];
      const pl = { pid, seat, name, stack, cards };
      seat2p.set(seat, pl);
      id2p.set(pid, pl);
    }
    return { seat2p, id2p };
  }

  function getRound(ohh, street){
    const rounds = Array.isArray(ohh.rounds) ? ohh.rounds : [];
    return rounds.find(r => String(r.street) === street) || null;
  }

  function updateHeroMenuFromFirstHand(objs){
    const prev = heroSelect.value;

    heroSelect.innerHTML = "";
    const optAuto = document.createElement("option");
    optAuto.value = "auto";
    optAuto.textContent = "Auto (lowest seat with hole cards)";
    heroSelect.appendChild(optAuto);

    if (!objs.length) return;

    const ohh = getOHHRoot(objs[0]);
    const { seat2p } = buildPlayers(ohh);
    const seats = Array.from(seat2p.keys()).sort((a,b)=>a-b);

    for (const s of seats){
      const p = seat2p.get(s);
      const hasCards = Array.isArray(p.cards) && p.cards.length === 2;
      const opt = document.createElement("option");
      opt.value = String(p.pid);          // pid固定（名前変更に強い）
      opt.textContent = hasCards ? `Seat ${p.seat}: ${p.name}` : `Seat ${p.seat}: ${p.name} (no cards)`;
      if (!hasCards) opt.disabled = true; // カード無しは選ばせない（Wizardエラー回避）
      heroSelect.appendChild(opt);
    }

    const exists = Array.from(heroSelect.options).some(o => o.value === prev && !o.disabled);
    heroSelect.value = exists ? prev : "auto";
  }

  function pickHero(id2p){
    const selected = heroSelect.value;
    if (selected !== "auto"){
      const pid = Number(selected);
      if (id2p.has(pid) && id2p.get(pid).cards?.length === 2) return pid;
    }
    const withCards = Array.from(id2p.values()).filter(p => p.cards?.length === 2).sort((a,b)=>a.seat-b.seat);
    return withCards[0]?.pid ?? Array.from(id2p.keys())[0];
  }

  function foldText(st){
    if (st === "Preflop") return "folded before Flop";
    if (st === "Flop") return "folded on the Flop";
    if (st === "Turn") return "folded on the Turn";
    if (st === "River") return "folded on the River";
    return "folded";
  }

  function convertOne(obj){
    const ohh = getOHHRoot(obj);
    const { seat2p, id2p } = buildPlayers(ohh);

    const heroPid = pickHero(id2p);
    const hero = id2p.get(heroPid);
    if (!hero) throw new Error("Heroが見つかりません。");

    // 表示名：Heroだけ固定名にする（GTO Wizardで迷子になりにくい）
    const nameOf = (pid) => (pid === heroPid ? "Hero" : (id2p.get(pid)?.name ?? "Player"));

    const sb = Number(ohh.small_blind_amount ?? 0);
    const bb = Number(ohh.big_blind_amount ?? 0);
    const table = String(ohh.table_name ?? "Table");
    const tableSize = Number(ohh.table_size ?? seat2p.size);

    let dealerSeat = Number(ohh.dealer_seat ?? hero.seat);
    if (!seat2p.has(dealerSeat)) dealerSeat = hero.seat;

    const startIso = String(ohh.start_date_utc ?? obj.createdAt ?? new Date().toISOString());
    const { handId, ts } = parseISOToUTC(startIso);

    const seats = Array.from(seat2p.keys()).sort((a,b)=>a-b);

    // Preflop postsからSB/BB pid を取る（SUMMARYの役割表示用）
    let sbPid = null, bbPid = null;
    const pre = getRound(ohh, "Preflop");
    const preActs = Array.isArray(pre?.actions) ? pre.actions : [];
    for (const a of preActs){
      const act = normalizeAct(a.action);
      if (act === "post_sb") sbPid = Number(a.player_id);
      if (act === "post_bb") bbPid = Number(a.player_id);
    }
    const btnPid = seat2p.get(dealerSeat)?.pid ?? null;

    // pot情報（勝ち額はOHH側に入ってることが多い）
    let totalPot = 0, rake = 0;
    const winMap = new Map(); // pid -> win_amount
    const pots = Array.isArray(ohh.pots) ? ohh.pots : [];
    if (pots.length){
      totalPot = Number(pots[0].amount ?? 0);
      rake = Number(pots[0].rake ?? 0);
      for (const p of pots){
        for (const w of (p.player_wins ?? [])){
          const pid = Number(w.player_id);
          winMap.set(pid, (winMap.get(pid) || 0) + Number(w.win_amount ?? 0));
        }
      }
    }

    const out = [];
    out.push(`PokerStars Hand #${handId}:  Hold'em No Limit (${CUR}${money(sb)}/${CUR}${money(bb)} ${CURCODE}) - ${ts} UTC`);
    out.push(`Table '${table}' ${tableSize}-max Seat #${dealerSeat} is the button`);
    for (const s of seats){
      const p = seat2p.get(s);
      out.push(`Seat ${p.seat}: ${nameOf(p.pid)} (${CUR}${money(p.stack)} in chips)`);
    }

    // 状態追跡
    const active = new Set(Array.from(id2p.keys()));
    const foldAt = new Map();    // pid -> street
    const invested = new Map();  // pid -> total invested (for "(didn't bet)")
    for (const pid of id2p.keys()) invested.set(pid, 0);

    // 盤面
    const board = [];

    // handがfoldで終わったか
    let endedByFold = false;
    let endStreet = null;
    let uncalledLine = null;
    let winnerPid = null;

    function streetState(){
      return { contrib: new Map(Array.from(id2p.keys()).map(pid => [pid, 0])), highest: 0 };
    }

    function max2(values){
      const arr = Array.from(values).sort((a,b)=>b-a);
      return { max: arr[0] ?? 0, second: arr[1] ?? 0 };
    }

    function applyAction(a, st, street){
      const pid = Number(a.player_id);
      if (!id2p.has(pid)) return null;

      const who = nameOf(pid);
      const act = normalizeAct(a.action);
      const amt = Number(a.amount ?? 0);

      const getC = () => st.contrib.get(pid) ?? 0;
      const setC = (v) => st.contrib.set(pid, v);

      const addInvest = (x) => invested.set(pid, (invested.get(pid) || 0) + Math.max(0, x));

      if (act === "post_sb"){
        addInvest(amt);
        const newC = getC() + amt; setC(newC); st.highest = Math.max(st.highest, newC);
        return `${who}: posts small blind ${CUR}${money(amt)}`;
      }
      if (act === "post_bb"){
        addInvest(amt);
        const newC = getC() + amt; setC(newC); st.highest = Math.max(st.highest, newC);
        return `${who}: posts big blind ${CUR}${money(amt)}`;
      }
      if (act === "post_ante"){
        addInvest(amt);
        const newC = getC() + amt; setC(newC); st.highest = Math.max(st.highest, newC);
        return `${who}: posts the ante ${CUR}${money(amt)}`;
      }

      if (act === "fold"){
        if (!foldAt.has(pid)) foldAt.set(pid, street);
        active.delete(pid);
        return `${who}: folds`;
      }

      if (act === "check") return `${who}: checks`;

      if (act === "bet"){
        const newTotal = amt;
        const put = Math.max(0, newTotal - getC());
        addInvest(put);
        setC(newTotal); st.highest = Math.max(st.highest, newTotal);
        return `${who}: bets ${CUR}${money(put)}`;
      }

      if (act === "call"){
        let newTotal = amt;
        let put = newTotal - getC();
        if (put < -1e-9){
          put = amt;
          newTotal = getC() + put;
        }
        put = Math.max(0, put);
        addInvest(put);
        setC(newTotal); st.highest = Math.max(st.highest, newTotal);
        return `${who}: calls ${CUR}${money(put)}`;
      }

      if (act === "raise" || act === "allin"){
        const highestBefore = st.highest;
        let newTotal = amt;
        if (newTotal <= highestBefore + 1e-9) newTotal = highestBefore + amt; // 増分表記の保険
        const raiseInc = Math.max(0, newTotal - highestBefore);
        const put = Math.max(0, newTotal - getC());
        addInvest(put);
        setC(newTotal); st.highest = Math.max(st.highest, newTotal);
        return `${who}: raises ${CUR}${money(raiseInc)} to ${CUR}${money(newTotal)}`;
      }

      return amt ? `${who}: ${a.action} ${CUR}${money(amt)}` : `${who}: ${a.action}`;
    }

    function maybeEndByFold(st, street){
      if (active.size === 1){
        endedByFold = true;
        endStreet = street;
        winnerPid = Array.from(active)[0];

        // uncalled = maxContrib - secondMaxContrib（このstreetの未コール分）
        const { max, second } = max2(st.contrib.values());
        const uncalled = Math.max(0, max - second);
        if (uncalled > 0){
          uncalledLine = `Uncalled bet (${CUR}${money(uncalled)}) returned to ${nameOf(winnerPid)}`;
        }
        return true;
      }
      return false;
    }

    // --- Preflop: posts -> HOLE CARDS -> rest ---
    const preSt = streetState();
    let i = 0;
    while (i < preActs.length && ["post_sb","post_bb","post_ante"].includes(normalizeAct(preActs[i].action))){
      const line = applyAction(preActs[i], preSt, "Preflop");
      if (line) out.push(line);
      i++;
    }
    out.push("*** HOLE CARDS ***");
    out.push(`Dealt to Hero ${cardsBracket(hero.cards || ["??","??"])}`);
    for (; i < preActs.length; i++){
      const line = applyAction(preActs[i], preSt, "Preflop");
      if (line) out.push(line);
      if (maybeEndByFold(preSt, "Preflop")) break;
    }

    // streets helper
    function doStreet(street){
      if (endedByFold) return;
      const r = getRound(ohh, street);
      if (!r) return;
      const cards = Array.isArray(r.cards) ? r.cards : [];
      const acts  = Array.isArray(r.actions) ? r.actions : [];

      // header + board
      if (street === "Flop"){
        board.length = 0;
        for (const c of cards) board.push(c);
        out.push(`*** FLOP *** ${cardsBracket(board)}`);
      } else if (street === "Turn"){
        for (const c of cards) board.push(c);
        out.push(`*** TURN *** ${cardsBracket(board.slice(0,3))} ${cardsBracket([board[3]])}`);
      } else if (street === "River"){
        for (const c of cards) board.push(c);
        out.push(`*** RIVER *** ${cardsBracket(board.slice(0,4))} ${cardsBracket([board[4]])}`);
      }

      const st = streetState();
      for (const a of acts){
        const line = applyAction(a, st, street);
        if (line) out.push(line);
        if (maybeEndByFold(st, street)) return;
      }
    }

    doStreet("Flop");
    doStreet("Turn");
    doStreet("River");

    // winner amount
    if (winnerPid === null){
      // showdown想定なら winMap最大をwinnerにする（簡易）
      if (winMap.size){
        winnerPid = Array.from(winMap.entries()).sort((a,b)=>b[1]-a[1])[0][0];
      }
    }

    if (endedByFold && uncalledLine) out.push(uncalledLine);

    // collected line（あるとWizardが喜びがち）
    if (winnerPid !== null){
      const winAmt = winMap.get(winnerPid);
      if (typeof winAmt === "number"){
        out.push(`${nameOf(winnerPid)} collected ${CUR}${money(winAmt)} from pot`);
      }
    }

    // ★フォールド勝ちはSHOW DOWN無し（PokerStars寄せ）
    if (!endedByFold){
      out.push("*** SHOW DOWN ***");
      out.push(`Hero: shows ${cardsBracket(hero.cards || ["??","??"])}`);
    }

    // --- SUMMARY ---
    out.push("*** SUMMARY ***");
    out.push(`Total pot ${CUR}${money(totalPot)} | Rake ${CUR}${money(rake)}`);
    if (board.length) out.push(`Board ${cardsBracket(board)}`);

    function roleText(pid){
      const tags = [];
      if (btnPid !== null && pid === btnPid) tags.push("button");
      if (sbPid !== null && pid === sbPid) tags.push("small blind");
      if (bbPid !== null && pid === bbPid) tags.push("big blind");
      return tags.length ? ` (${tags.join(") (")})` : "";
    }

    for (const s of seats){
      const p = seat2p.get(s);
      const pid = p.pid;
      const who = nameOf(pid) + roleText(pid);

      if (winnerPid !== null && pid === winnerPid && winMap.has(pid)){
        out.push(`Seat ${p.seat}: ${who} collected (${CUR}${money(winMap.get(pid))})`);
        continue;
      }

      if (foldAt.has(pid)){
        const st = foldAt.get(pid);
        const didntBet = (invested.get(pid) || 0) <= 0 ? " (didn't bet)" : "";
        out.push(`Seat ${p.seat}: ${who} ${foldText(st)}${didntBet}`);
        continue;
      }

      // 負け / それ以外（簡易）
      out.push(`Seat ${p.seat}: ${who} mucked`);
    }

    return out.join("\n");
  }

  function convertAll(){
    const objs = loadJsonObjects(inputEl.value);
    if (!objs.length) throw new Error("JSONが空です。");

    updateHeroMenuFromFirstHand(objs);

    const outs = objs.map(convertOne);
    outputEl.value = outs.join("\n\n");
    setStatus(`変換OK: ${outs.length}ハンド`, true);
  }

  let debounceTimer = null;
  inputEl.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      try{
        const objs = loadJsonObjects(inputEl.value);
        if (!objs.length) return;
        updateHeroMenuFromFirstHand(objs);
      }catch{}
    }, 250);
  });

  $("convertBtn").addEventListener("click", () => {
    try { convertAll(); }
    catch(e){ outputEl.value = ""; setStatus(`エラー: ${e.message ?? e}`, false); }
  });

  heroSelect.addEventListener("change", () => {
    if ((inputEl.value || "").trim()){
      try { convertAll(); }
      catch(e){ outputEl.value = ""; setStatus(`エラー: ${e.message ?? e}`, false); }
    }
  });

  $("copyBtn").addEventListener("click", async () => {
    try{
      await navigator.clipboard.writeText(outputEl.value || "");
      setStatus("コピーしました。GTO Wizardへ貼り付けOK。", true);
    }catch{
      setStatus("コピー失敗。右の出力欄を手動で全選択→コピーしてください。", false);
    }
  });

  $("downloadBtn").addEventListener("click", () => {
    const txt = outputEl.value || "";
    const blob = new Blob([txt], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "wizard_handhistory.txt";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setStatus("TXTをダウンロードしました。", true);
  });
})();
</script>
</body>
</html>
