<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OHH → GTO Wizard 変換</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; margin: 0; }
    header { padding: 14px 16px; border-bottom: 1px solid rgba(127,127,127,.35); }
    h1 { font-size: 16px; margin: 0 0 6px 0; }
    .sub { font-size: 12px; opacity: .8; line-height: 1.4; }
    main { padding: 14px 16px; display: grid; gap: 10px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button, select {
      padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(127,127,127,.45);
      font-size: 12px;
    }
    button { cursor: pointer; }
    .status { font-size: 12px; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(127,127,127,.35); opacity: .95; }
    .ok { border-color: rgba(80,160,80,.45); }
    .err { border-color: rgba(200,80,80,.55); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
    textarea {
      width: 100%; min-height: 520px; resize: vertical; padding: 10px;
      border-radius: 10px; border: 1px solid rgba(127,127,127,.45);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px; line-height: 1.35;
    }
    .hint { font-size: 12px; opacity: .8; line-height: 1.4; }
    .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono"; border: 1px solid rgba(127,127,127,.45); border-bottom-width: 2px; padding: 1px 6px; border-radius: 7px; }
    .spacer { flex: 1; }
  </style>
</head>
<body>
<header>
  <h1>OHH(JSON) → GTO Wizardに貼れるテキストHH</h1>
  <div class="sub">
    左にOHH(JSON)を貼る → <span class="kbd">Convert</span> → <span class="kbd">Copy</span> → GTO Wizardへ。<br>
    <b>重要:</b> 出力上のHero名は常に <code>Hero</code> に固定します（GTO WizardでHeroがズレない対策）。<br>
    Auto Heroは「カード情報がある人の中で、席番号が一番小さい人」。メニューで変更できます（カード無しは選べません）。
  </div>
</header>

<main>
  <div class="row">
    <button id="convertBtn">Convert</button>
    <button id="copyBtn">Copy</button>
    <button id="downloadBtn">Download .txt</button>

    <div class="spacer"></div>

    <label class="hint" for="heroSelect">Hero:</label>
    <select id="heroSelect" title="Heroを選択（出力上は常にHeroに置換されます）">
      <option value="auto" selected>Auto (lowest seat with hole cards)</option>
    </select>

    <div id="status" class="status">準備OK。左にJSONを貼って Convert。</div>
  </div>

  <div class="grid">
    <div>
      <div class="hint">入力（OHH JSON）</div>
      <textarea id="input" spellcheck="false" placeholder="ここにOHH(JSON)を貼り付け"></textarea>
    </div>
    <div>
      <div class="hint">出力（GTO Wizard貼り付け用）</div>
      <textarea id="output" spellcheck="false" readonly></textarea>
      <div class="hint">出力は「Heroのカードのみ表示」。他プレイヤーのホールカードは一切出しません。</div>
    </div>
  </div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const inputEl = $("input");
  const outputEl = $("output");
  const statusEl = $("status");
  const heroSelect = $("heroSelect");

  const CUR = "$";          // 飾り。固定でOK
  const HERO_NAME = "Hero"; // ★ここが肝：出力上のHero名は必ずこれ

  function setStatus(msg, ok=true){
    statusEl.textContent = msg;
    statusEl.classList.remove("ok","err");
    statusEl.classList.add(ok ? "ok" : "err");
  }

  function fmt(n){
    const v = Math.round(Number(n || 0) * 100) / 100;
    const s = v.toFixed(2);
    return s.replace(/\.00$/, "").replace(/(\.\d)0$/, "$1");
  }

  function sanitizeName(name){
    const s = String(name ?? "").trim().replace(/\s+/g, "_");
    const cleaned = s.replace(/[^0-9A-Za-z_]/g, "");
    if (!cleaned) return "Player";
    // "Hero" という名前の人がいた場合の衝突回避
    if (cleaned.toLowerCase() === "hero") return "Player_Hero";
    return cleaned;
  }

  function cardsBracket(cards){ return `[${(cards ?? []).join(" ")}]`; }

  function parseISOToUTC(iso){
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return { handId: String(Date.now()), ts: "1970/01/01 00:00:00" };
    const handId = String(d.getTime());
    const pad = (x) => String(x).padStart(2,"0");
    const ts = `${d.getUTCFullYear()}/${pad(d.getUTCMonth()+1)}/${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
    return { handId, ts };
  }

  function loadJsonObjects(text){
    const t = (text ?? "").trim();
    if (!t) return [];
    try {
      const obj = JSON.parse(t);
      if (Array.isArray(obj)) return obj;
      if (obj && typeof obj === "object") return [obj];
      throw new Error("JSONの形式が不正です。");
    } catch {
      const parts = t.split(/\n\s*\n/g).map(x => x.trim()).filter(Boolean);
      return parts.map(p => JSON.parse(p));
    }
  }

  function getOHHRoot(obj){
    if (obj && typeof obj === "object" && obj.ohh && typeof obj.ohh === "object") return obj.ohh;
    return obj;
  }

  function buildPlayers(ohh){
    const playersRaw = Array.isArray(ohh.players) ? ohh.players : [];
    const seat2p = new Map();
    const id2p = new Map();
    const used = new Map();

    for (const p of playersRaw){
      const pid = Number(p.id);
      const seat = Number(p.seat);
      const rawName = String(p.name ?? `Player${pid}`);
      let name = sanitizeName(rawName);
      if (used.has(name)) name = `${name}_${seat}`;
      used.set(name, true);

      const stack = Number(p.starting_stack ?? 0);
      const cards = Array.isArray(p.cards) ? p.cards.slice() : [];
      const pl = { pid, seat, rawName, name, stack, cards };
      seat2p.set(seat, pl);
      id2p.set(pid, pl);
    }
    return { seat2p, id2p };
  }

  function isPostAction(action){
    const a = String(action ?? "").toLowerCase();
    return a.includes("post sb") || a.includes("post bb") || a.includes("post ante") ||
           a.includes("post small blind") || a.includes("post big blind") || a.includes("post");
  }

  function pickAutoHero(id2p){
    const withCards = Array.from(id2p.values())
      .filter(p => Array.isArray(p.cards) && p.cards.length === 2)
      .sort((a,b)=>a.seat-b.seat);

    if (withCards.length){
      return { hero: withCards[0], note: `Auto Hero: Seat ${withCards[0].seat}（カードあり最小席）` };
    }

    // ここに来る＝誰にもカード情報が無いOHH（Wizardで厳しいことが多い）
    const seats = Array.from(id2p.values()).sort((a,b)=>a.seat-b.seat);
    const hero = seats[0] || { pid: -1, seat: 0, name: "Player", cards: [] };
    return { hero, note: `警告: OHHにホールカード情報がありません（Wizardで弾かれる可能性）` };
  }

  function updateHeroMenuFromFirstHand(objs){
    const prev = heroSelect.value;

    heroSelect.innerHTML = "";
    const optAuto = document.createElement("option");
    optAuto.value = "auto";
    optAuto.textContent = "Auto (lowest seat with hole cards)";
    heroSelect.appendChild(optAuto);

    if (!objs.length) return;

    const ohh = getOHHRoot(objs[0]);
    const { seat2p } = buildPlayers(ohh);
    const seats = Array.from(seat2p.keys()).sort((a,b)=>a-b);

    // 選択肢は「カードありのみ」
    for (const s of seats){
      const p = seat2p.get(s);
      const hasCards = Array.isArray(p.cards) && p.cards.length === 2;
      const opt = document.createElement("option");
      opt.value = String(p.pid); // ★valueはpidにする（名前変化でもズレにくい）
      opt.textContent = hasCards ? `Seat ${p.seat}: ${p.name}` : `Seat ${p.seat}: ${p.name} (no cards)`;
      if (!hasCards) opt.disabled = true;
      heroSelect.appendChild(opt);
    }

    const exists = Array.from(heroSelect.options).some(o => o.value === prev && !o.disabled);
    heroSelect.value = exists ? prev : "auto";
  }

  function renderAction(a, id2p, state, nameOf){
    const pid = Number(a.player_id);
    if (!id2p.has(pid)) return null;
    const pl = id2p.get(pid);

    const who = nameOf(pid);
    const act = String(a.action ?? "").trim();
    const actL = act.toLowerCase();
    const amt = Number(a.amount ?? 0);

    const getC = () => state.contrib.get(pid) ?? 0;
    const setC = (v) => state.contrib.set(pid, v);

    if (actL.includes("post sb") || actL.includes("post small blind")){
      const newC = getC() + amt; setC(newC); state.highest = Math.max(state.highest, newC);
      return `${who}: posts small blind ${CUR}${fmt(amt)}`;
    }
    if (actL.includes("post bb") || actL.includes("post big blind")){
      const newC = getC() + amt; setC(newC); state.highest = Math.max(state.highest, newC);
      return `${who}: posts big blind ${CUR}${fmt(amt)}`;
    }
    if (actL.includes("post ante")){
      const newC = getC() + amt; setC(newC); state.highest = Math.max(state.highest, newC);
      return `${who}: posts ante ${CUR}${fmt(amt)}`;
    }

    if (actL === "fold"){
      state.inHand.delete(pid);
      return `${who}: folds`;
    }
    if (actL === "check"){
      return `${who}: checks`;
    }

    if (actL === "bet"){
      const newTotal = amt;
      const put = Math.max(0, newTotal - getC());
      setC(newTotal); state.highest = Math.max(state.highest, newTotal);
      return `${who}: bets ${CUR}${fmt(put)}`;
    }

    if (actL === "call"){
      let newTotal = amt;
      let put = newTotal - getC();
      if (put < -1e-9){
        put = amt;
        newTotal = getC() + put;
      }
      setC(newTotal); state.highest = Math.max(state.highest, newTotal);
      return `${who}: calls ${CUR}${fmt(Math.max(0, put))}`;
    }

    if (actL === "raise" || actL.includes("all")){
      const highestBefore = state.highest;
      let newTotal = amt;
      if (newTotal <= highestBefore + 1e-9) newTotal = highestBefore + amt;

      const raiseInc = Math.max(0, newTotal - highestBefore);
      const put = Math.max(0, newTotal - getC());

      setC(newTotal); state.highest = Math.max(state.highest, newTotal);
      return `${who}: raises ${CUR}${fmt(raiseInc)} to ${CUR}${fmt(newTotal)}`;
    }

    return amt ? `${who}: ${act} ${CUR}${fmt(amt)}` : `${who}: ${act}`;
  }

  function convertOne(obj){
    const ohh = getOHHRoot(obj);
    const { seat2p, id2p } = buildPlayers(ohh);

    // Hero決定（Auto or pid指定）
    let heroInfo;
    const selected = heroSelect.value;

    if (selected === "auto"){
      heroInfo = pickAutoHero(id2p);
    } else {
      const pid = Number(selected);
      const found = id2p.has(pid) ? id2p.get(pid) : null;
      if (found && found.cards && found.cards.length === 2){
        heroInfo = { hero: found, note: `Hero: Seat ${found.seat}（メニュー指定）` };
      } else {
        heroInfo = pickAutoHero(id2p);
      }
    }

    const hero = heroInfo.hero;

    // ★nameOf: 選ばれたpidだけ "Hero" に置換
    const nameOf = (pid) => (pid === hero.pid ? HERO_NAME : (id2p.get(pid)?.name ?? "Player"));

    const sb = Number(ohh.small_blind_amount ?? 0);
    const bb = Number(ohh.big_blind_amount ?? 0);
    const table = String(ohh.table_name ?? "Table");
    const tableSize = Number(ohh.table_size ?? seat2p.size);
    const dealerSeat = Number(ohh.dealer_seat ?? 1);

    const startIso = String(ohh.start_date_utc ?? obj.createdAt ?? new Date().toISOString());
    const { handId, ts } = parseISOToUTC(startIso);

    const out = [];
    out.push(`PokerStars Hand #${handId}:  Hold'em No Limit (${CUR}${fmt(sb)}/${CUR}${fmt(bb)}) - ${ts} UTC`);
    out.push(`Table '${table}' ${tableSize}-max Seat #${dealerSeat} is the button`);

    const seats = Array.from(seat2p.keys()).sort((a,b)=>a-b);
    for (const s of seats){
      const p = seat2p.get(s);
      out.push(`Seat ${p.seat}: ${nameOf(p.pid)} (${CUR}${fmt(p.stack)} in chips)`);
    }

    const rounds = new Map();
    for (const r of (ohh.rounds ?? [])) rounds.set(String(r.street), r);

    const pre = rounds.get("Preflop");
    if (!pre) throw new Error("Preflopが見つかりません。");

    const allPids = Array.from(id2p.keys());
    const inHand = new Set(allPids);

    // Preflop
    const preState = {
      contrib: new Map(allPids.map(pid => [pid, 0])),
      highest: 0,
      inHand
    };

    const preActions = Array.isArray(pre.actions) ? pre.actions : [];
    let lastPostIdx = -1;
    for (let i = 0; i < preActions.length; i++){
      if (isPostAction(preActions[i].action)) lastPostIdx = i;
    }

    let insertedHoleCards = false;
    const insertHoleCards = () => {
      if (insertedHoleCards) return;
      insertedHoleCards = true;
      out.push("*** HOLE CARDS ***");
      // ★ここも必ず "Dealt to Hero"
      if (hero.cards && hero.cards.length === 2){
        out.push(`Dealt to ${HERO_NAME} ${cardsBracket(hero.cards)}`);
      } else {
        out.push(`Dealt to ${HERO_NAME} [?? ??]`);
      }
    };

    if (lastPostIdx < 0) insertHoleCards();

    for (let i = 0; i < preActions.length; i++){
      if (i === lastPostIdx + 1) insertHoleCards();
      const line = renderAction(preActions[i], id2p, preState, nameOf);
      if (line) out.push(line);
    }
    if (!insertedHoleCards) insertHoleCards();

    // Streets helper
    let board = [];
    function doStreet(street){
      const r = rounds.get(street);
      if (!r) return;
      const cards = Array.isArray(r.cards) ? r.cards : [];
      const acts  = Array.isArray(r.actions) ? r.actions : [];

      const st = {
        contrib: new Map(allPids.map(pid => [pid, 0])),
        highest: 0,
        inHand
      };

      if (street === "Flop"){
        board = cards.slice();
        out.push(`*** FLOP *** ${cardsBracket(board)}`);
      } else if (street === "Turn"){
        board = board.concat(cards);
        out.push(`*** TURN *** ${cardsBracket(board.slice(0,3))} ${cardsBracket([board[3]])}`);
      } else if (street === "River"){
        board = board.concat(cards);
        out.push(`*** RIVER *** ${cardsBracket(board.slice(0,4))} ${cardsBracket([board[4]])}`);
      }

      for (const a of acts){
        const line = renderAction(a, id2p, st, nameOf);
        if (line) out.push(line);
      }
    }

    doStreet("Flop");
    doStreet("Turn");
    doStreet("River");

    // Showdown (Heroのみshow)
    out.push("*** SHOW DOWN ***");
    if (hero.cards && hero.cards.length === 2){
      out.push(`${HERO_NAME}: shows ${cardsBracket(hero.cards)}`);
    } else {
      out.push(`${HERO_NAME}: doesn't show hand`);
    }
    for (const pid of inHand){
      if (pid === hero.pid) continue;
      out.push(`${nameOf(pid)}: doesn't show hand`);
    }

    // Pots / summary
    const pots = Array.isArray(ohh.pots) ? ohh.pots : [];
    if (pots.length){
      for (const p of pots){
        for (const w of (p.player_wins ?? [])){
          const winPid = Number(w.player_id);
          out.push(`${nameOf(winPid)} collected ${CUR}${fmt(w.win_amount ?? 0)} from pot`);
        }
      }
    }

    out.push("*** SUMMARY ***");
    if (pots.length){
      out.push(`Total pot ${CUR}${fmt(pots[0].amount ?? 0)} | Rake ${CUR}${fmt(pots[0].rake ?? 0)}`);
    }
    if (board.length){
      out.push(`Board ${cardsBracket(board)}`);
    }

    return { text: out.join("\n"), note: heroInfo.note };
  }

  function convertAll(){
    const objs = loadJsonObjects(inputEl.value);
    if (!objs.length) throw new Error("JSONが空です。");

    updateHeroMenuFromFirstHand(objs);

    const outs = [];
    let note = "";
    for (let i = 0; i < objs.length; i++){
      const res = convertOne(objs[i]);
      outs.push(res.text);
      if (i === 0) note = res.note || "";
    }
    outputEl.value = outs.join("\n\n");
    setStatus(`変換OK: ${outs.length}ハンド。${note}`, true);
  }

  // 入力が固まったらHeroメニュー更新（変換はしない）
  let debounceTimer = null;
  inputEl.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      try{
        const objs = loadJsonObjects(inputEl.value);
        if (!objs.length) return;
        updateHeroMenuFromFirstHand(objs);
      } catch { /* typing中は無視 */ }
    }, 250);
  });

  $("convertBtn").addEventListener("click", () => {
    try { convertAll(); }
    catch(e){ outputEl.value=""; setStatus(`エラー: ${e.message ?? e}`, false); }
  });

  heroSelect.addEventListener("change", () => {
    if ((inputEl.value || "").trim()){
      try { convertAll(); }
      catch(e){ outputEl.value=""; setStatus(`エラー: ${e.message ?? e}`, false); }
    }
  });

  $("copyBtn").addEventListener("click", async () => {
    try{
      await navigator.clipboard.writeText(outputEl.value || "");
      setStatus("コピーしました。GTO Wizardへ貼り付けOK。", true);
    } catch {
      setStatus("コピー失敗。右の出力欄を手動で全選択→コピーしてください。", false);
    }
  });

  $("downloadBtn").addEventListener("click", () => {
    const txt = outputEl.value || "";
    const blob = new Blob([txt], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "wizard_handhistory.txt";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    setStatus("TXTをダウンロードしました。", true);
  });
})();
</script>
</body>
</html>
